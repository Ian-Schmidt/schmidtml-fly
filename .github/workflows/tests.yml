name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # neither the connectome nor any question data is needed: the tests run on a toy brain.
      # The coverage floor is tool.coverage.report.fail_under in pyproject.toml; the badge shows the same number.
      - run: uv run pytest
