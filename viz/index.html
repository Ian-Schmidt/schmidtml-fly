<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Муха сдаёт тест</title>
<style>
  :root { --bg:#07090d; --fg:#e8edf5; --muted:#8a94a6; --accent:#4f8cff; --ok:#3ecf8e; --bad:#ff5d6c; --panel:rgba(12,16,24,.74); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; }
  .hud { position:fixed; pointer-events:none; }
  body.clean .hud { display:none !important; }  /* иначе #options и #legend с display:grid перебивают по специфичности */
  #top { top:22px; left:50%; transform:translateX(-50%); width:min(920px, 88vw); text-align:center; }
  #level { color:var(--accent); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
  #question { font-size:21px; font-weight:600; margin-top:6px; white-space:pre-wrap; max-height:34vh; overflow:hidden; }
  #phase { margin-top:8px; color:var(--muted); font-size:14px; min-height:20px; }
  #options { bottom:22px; right:22px; width:min(460px, 44vw); display:grid; gap:8px; }
  .opt { background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:10px 12px;
    backdrop-filter:blur(6px); transition:border-color .3s, opacity .3s, box-shadow .3s; }
  .opt.now { border-color:var(--accent); }
  .opt.chosen { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 24px rgba(79,140,255,.35); }
  .opt.dim { opacity:.5; }
  .row { display:flex; gap:8px; align-items:flex-start; }
  .l { font-weight:700; color:var(--accent); width:16px; }
  .t { flex:1; font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .p { width:44px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .opt.ok .p { color:var(--ok); font-weight:700; } .opt.bad .p { color:var(--bad); font-weight:700; }
  .bar { height:4px; background:rgba(255,255,255,.08); border-radius:2px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  #legend { bottom:22px; left:22px; font-size:12px; color:var(--muted); display:grid; gap:3px; }
  #legend b { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  #stats { top:22px; right:22px; font-size:12px; color:var(--muted); text-align:right; line-height:1.6; }
  #help { top:22px; left:22px; font-size:12px; color:var(--muted); line-height:1.6; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); }
</style>
</head>
<body>
<div id="loading">Загружаю мозг мухи…</div>
<div class="hud" id="top"><div id="level"></div><div id="question"></div><div id="phase"></div></div>
<div class="hud" id="options"></div>
<div class="hud" id="legend"></div>
<div class="hud" id="stats"></div>
<div class="hud" id="help">Пробел — пауза · ← → — вопрос · H — скрыть интерфейс<br>Мышь — вращать, колесо — приблизить<br><a href="desk.html" style="pointer-events:auto;color:inherit">Сцена за столом →</a></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { load, brainCloud, Player, LETTERS } from "./replay.js";

const params = new URLSearchParams(location.search);
const RUN = params.get("run") || "quiz";
if (params.has("clean")) document.body.classList.add("clean");

let data;
try {
  data = await load(RUN);
} catch (e) {
  document.getElementById("loading").textContent = `Нет данных ${e.message}. Сначала: uv run python export_viz.py --run runs/${RUN}`;
  throw e;
}
document.getElementById("loading").remove();
const { brain, run, N } = data;
const K = run.k, Q = run.questions.length;
const player = new Player(run, { speed: +(params.get("speed") || 6), q: +(params.get("q") || 0) });

// --- сцена ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07090d);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 20000);
camera.position.set(0, 90, -950);   // спереди: у FlyWire z растёт от передней части мозга к задней
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;   // полный оборот за ~3 минуты (update получает dt, иначе скорость зависит от FPS)
const cloud = brainCloud(data);
cloud.material.uniforms.scale.value = innerHeight / 2;
scene.add(cloud.points);

// --- интерфейс ---
const $ = (id) => document.getElementById(id);
$("legend").innerHTML = brain.classes.map((c) => `<div><b style="background:${c.color}"></b>${c.name}</div>`).join("");
const pct = (x) => `${Math.round(x * 100)}%`;
const ref = run.references || {}, exam = run.exam;
const num = (x) => (x * 100).toFixed(1).replace(".", ",");
const statsLine = [
  `${N.toLocaleString("ru-RU")} нейронов · FlyWire v783`,
  exam ? `невиданные вопросы: ${num(exam.mean)}% ± ${num(exam.sd)} (эп. ${exam.epochs[0]}–${exam.epochs[1]})` : "",
  exam ? `случайно ${num(ref.chance ?? 1 / K)}%` : "",
].filter(Boolean);
const optionsEl = $("options");

function showQuestion() {
  const item = player.item;
  $("level").textContent = `${run.title} · ${item.topic} · ${player.qi + 1}/${Q}`;
  const plain = (s) => s.replace(/\$/g, "");   // формулы из банка вопросов («$n$-грамм») тут не рендерятся
  $("question").textContent = plain(item.q);
  optionsEl.innerHTML = item.options.map((o, i) =>
    `<div class="opt" id="o${i}"><div class="row"><span class="l">${LETTERS[i]}</span><span class="t"></span><span class="p"></span></div><div class="bar"><i></i></div></div>`).join("");
  item.options.forEach((o, i) => { optionsEl.querySelector(`#o${i} .t`).textContent = plain(o); });
}

function paintOptions() {
  const item = player.item, done = player.phase === "reveal";
  item.options.forEach((_, i) => {
    const el = optionsEl.querySelector(`#o${i}`);
    el.querySelector("i").style.width = pct(player.bar(i));
    el.classList.toggle("now", !done && i === player.k);
    el.classList.toggle("chosen", done && i === item.chosen);
    el.classList.toggle("dim", done && i !== item.chosen && !item.answer.includes(i));
    el.classList.toggle("ok", done && item.answer.includes(i));
    el.classList.toggle("bad", done && i === item.chosen && !item.correct);
    el.querySelector(".p").textContent = done ? pct(item.probs[i]) + (item.answer.includes(i) ? " ✓" : "") : "";
  });
  $("phase").textContent = player.status;
}

addEventListener("keydown", (e) => {
  if (e.code === "Space") player.paused = !player.paused;
  else if (e.code === "ArrowRight") player.next(1);
  else if (e.code === "ArrowLeft") player.next(-1);
  else if (e.code === "KeyH") document.body.classList.toggle("clean");
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  cloud.material.uniforms.scale.value = innerHeight / 2;
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  player.tick(dt);
  if (player.changed) { player.changed = false; cloud.clear(); showQuestion(); }
  const active = cloud.update(player.target());
  $("stats").innerHTML = [...statsLine, `активны сейчас: ${active.toLocaleString("ru-RU")}`].join("<br>");
  paintOptions();
  controls.update(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
